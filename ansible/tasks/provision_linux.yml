---
- name: Add APT PPA repositories
  ansible.builtin.apt_repository:
    repo: "ppa:{{ item }}"
    state: present
  loop: "{{ apt_ppa_repos | default([]) }}"
  when: apt_ppa_repos | default([]) | length > 0

- name: Install APT packages
  ansible.builtin.apt:
    name: "{{ apt_install }}"
    state: present
    update_cache: true
  when: apt_install is defined

- name: Create user workspace directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ user_paths | default([]) }}"
  when: user_paths is defined

- name: Configure Git user name
  community.general.git_config:
    name: user.name
    value: "{{ git_user_name }}"
    scope: global
  become: true
  become_user: "{{ ansible_user }}"
  when: git_user_name is defined

- name: Configure Git email
  community.general.git_config:
    name: user.email
    value: "{{ git_email }}"
    scope: global
  become: true
  become_user: "{{ ansible_user }}"
  when: git_email is defined

- name: Configure Git editor
  community.general.git_config:
    name: core.editor
    value: "{{ git_settings.editor }}"
    scope: global
  become: true
  become_user: "{{ ansible_user }}"
  when: git_settings.editor is defined

- name: Configure Git pull rebase
  community.general.git_config:
    name: pull.rebase
    value: "{{ git_settings.pull_rebase | string | lower }}"
    scope: global
  become: true
  become_user: "{{ ansible_user }}"
  when: git_settings.pull_rebase is defined

- name: Configure Git push default
  community.general.git_config:
    name: push.default
    value: "{{ git_settings.push_default }}"
    scope: global
  become: true
  become_user: "{{ ansible_user }}"
  when: git_settings.push_default is defined

- name: Configure Git auto setup remote
  community.general.git_config:
    name: push.autoSetupRemote
    value: "{{ git_settings.auto_setup_remote | string | lower }}"
    scope: global
  become: true
  become_user: "{{ ansible_user }}"
  when: git_settings.auto_setup_remote is defined

- name: Configure GitHub SSH
  ansible.builtin.include_tasks: tasks/github-ssh.yml
  when: git_settings.use_ssh | default(false)

- name: Configure GitHub CLI credential helper
  community.general.git_config:
    name: credential.helper
    value: "!gh auth git-credential"
    scope: global
  become: true
  become_user: "{{ ansible_user }}"
  when: git_settings.use_github_cli | default(false)

- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ hostname_hostname }}"
  register: hostname_result
  when: hostname_hostname is defined

- name: Configure mDNS with Avahi
  ansible.builtin.include_tasks: tasks/mdns.yml

- name: Deploy bashrc for login user and root
  ansible.builtin.template:
    src: bashrc.j2
    dest: "{{ item.home }}/.bashrc"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0644"
    backup: true
  loop:
    - name: "{{ ansible_user }}"
      home: "{{ ansible_user_home }}"
    - name: root
      home: /root

- name: Set bash as login shell
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /bin/bash
  loop:
    - "{{ ansible_user }}"
    - root

- name: Remove leftover oh-my-zsh directories
  ansible.builtin.file:
    path: "{{ item.home }}/.oh-my-zsh"
    state: absent
  loop:
    - name: "{{ ansible_user }}"
      home: "{{ ansible_user_home }}"
    - name: root
      home: /root

- name: Remove leftover zshrc
  ansible.builtin.file:
    path: "{{ item.home }}/.zshrc"
    state: absent
  loop:
    - name: "{{ ansible_user }}"
      home: "{{ ansible_user_home }}"
    - name: root
      home: /root

- name: Deploy kilolink netplan configuration
  ansible.builtin.template:
    src: "{{ netplan_config_src }}"
    dest: /etc/netplan/55-bradford-config.yaml
    owner: root
    group: root
    mode: "0600"
  when: netplan_config_src is defined

volumes:
  openavc-data:
  # companion-config:

services:
  openavc:
    image: ghcr.io/open-avc/openavc:latest
    container_name: openavc
    network_mode: host
    cap_add:
      - NET_RAW
    volumes:
      - openavc-data:/data
    restart: unless-stopped
    # For serial/USB device passthrough, uncomment:
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

